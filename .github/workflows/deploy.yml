name: Deploy Fiora HRM to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, bcmath, curl, zip, intl
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-progress --no-interaction --no-scripts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM Dependencies & Build
        run: |
          npm install
          npm run build

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Sync Files to Server
        run: |
          rsync -avzr --delete \
            --exclude='.git*' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='storage/*.key' \
            --exclude='.env' \
            --exclude='public_storage' \
            --exclude='storage/app/public' \
            --exclude='storage/logs/*.log' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='.user.ini' \
            --exclude='php.ini' \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.TARGET_DIR }}

      - name: Post-Deployment Commands (Migrations & Optimization)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.TARGET_DIR }}
            echo "Starting post-deployment tasks..."
            
            # Use Namecheap's explicit PHP 8.2 binary for CLI
            PHP_BIN="/usr/local/bin/ea-php82"
            
            # Check if ea-php82 exists, otherwise try common alternatives
            if [ ! -f "$PHP_BIN" ]; then
                PHP_BIN="/usr/bin/php82"
            fi
            if [ ! -f "$PHP_BIN" ]; then
                PHP_BIN="php"
            fi
            
            echo "Using PHP binary: $PHP_BIN"
            
            # 1. PEHLE OWNERSHIP THEEK KAREIN (Taqe koi error na aaye)
            # Agar aapka SSH_USER root hai, toh ye lazmi hai
            chown -R writersplanet:writersplanet .

            # 2. Repair vendor
            echo "Repairing/Installing dependencies on server..."
            $PHP_BIN -d memory_limit=512M /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction || echo "Composer failed, check logs."
            
            # 3. Permissions set karein
            find . -type d -exec chmod 755 {} \;
            find . -type f -exec chmod 644 {} \;
            chmod -R 775 storage bootstrap/cache
            
            # 4. Run artisan commands
            $PHP_BIN -d memory_limit=512M artisan optimize:clear
            $PHP_BIN -d memory_limit=512M artisan migrate --force
            $PHP_BIN -d memory_limit=512M artisan storage:link --force
            $PHP_BIN -d memory_limit=512M artisan config:cache
            $PHP_BIN -d memory_limit=512M artisan route:cache
            $PHP_BIN -d memory_limit=512M artisan view:cache
            
            # 5. DUBARA OWNERSHIP (Double check taqe artisan files bhi sahi user ki hon)
            chown -R writersplanet:writersplanet .

            echo "Deployment finished successfully!"
